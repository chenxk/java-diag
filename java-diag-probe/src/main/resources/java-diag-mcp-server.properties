# =============================================================================
# java-diag MCP 探针（Probe）— 全量配置模板
# 复制为 ./java-diag-mcp-server.properties 或：java -jar ... --config /path/to/file
#
# 加载优先级：内置默认值 → 本文件 → 环境变量 JAVA_DIAG_* → CLI（最高）
# 完整说明：docs/CONFIGURATION.md（参数表以本文件为准）
# 本文件内亦可写 legacy 键，如 JAVA_DIAG_HTTP_PORT=8765
# =============================================================================

# --- 传输 / HTTP ---
# 传输模式：http | stdio（别名 sse/remote→http，std/local→stdio）
transport=http
# HTTP 监听地址
http.host=0.0.0.0
# HTTP 监听端口
http.port=8765

# --- 鉴权 Auth ---
# Agent / MCP 客户端 Bearer（必填，不可为空）
auth.token=CHANGE_ME_PROBE_TOKEN

# --- 日志白名单 / 诊断范围 ---
# 允许读取的日志目录，逗号分隔；空=平台默认（cwd、$HOME、java.io.tmpdir，非 Windows 且存在时含 /var/log、/tmp）
allowed.log.dirs=
# 可诊断 JVM 的 main class 正则；空=不过滤
allowed.main.class.regex=
# 进程名映射：逗号分隔 pattern=name（等价 CLI --app-map，可重复）
app.name.map=

# --- 工具超时与输出限制 ---
# 普通诊断子进程超时（毫秒）
tool.timeout.ms=15000
# heap/thread dump 等昂贵操作子进程超时（毫秒）
dump.timeout.ms=30000
# 工具 stdout/stderr 捕获上限（字节，默认 256KiB）
max.output.bytes=262144
# 是否启用危险工具（live GC、heap_dump 等）
dangerous.tools.enabled=false
# 审计日志路径
audit.path=./logs/java-diag-audit.log

# --- 限流（昂贵工具冷却）---
# 同一实例上 heap_dump 等工具的冷却时间（毫秒）；探针与网关各有一份配置
dump.cooldown.ms=10000

# --- 集群注册（可选；register.url 非空时启用心跳）---
# 逻辑服务名；空=本机主网卡 IP（非 hostname）
service.name=
# Gateway 根 URL，例如 http://gateway-host:8787
register.url=http://127.0.0.1:8787
# 调用 Gateway /registry/* 的 Bearer（必填）；须与网关 register.token 一致
register.token=CHANGE_ME_REGISTER_TOKEN
# 对外公布的 MCP base URL；空则 instanceId=advertise主机:http.port
advertise.url=
# 向 Gateway 发送心跳的间隔（秒，有效值 ≥5）
heartbeat.interval.seconds=20
# 实例标签：逗号分隔 key=value（等价 CLI --tag key=value，可重复）
tags=

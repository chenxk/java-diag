# 草稿：命名空间 + Secret（apply 前务必改掉全部 CHANGE_ME）
apiVersion: v1
kind: Namespace
metadata:
  name: java-diag
---
apiVersion: v1
kind: Secret
metadata:
  name: java-diag-tokens
  namespace: java-diag
type: Opaque
stringData:
  # Agent → Gateway
  agent-token: "CHANGE_ME_AGENT_TOKEN"
  # Gateway / Agent → Probe（探针 auth.token）
  probe-token: "CHANGE_ME_PROBE_TOKEN"
  # 可选：Registry /registry/* ；空则仅信任内网
  register-token: ""
  admin-user: "admin"
  admin-password: "CHANGE_ME_ADMIN_PASSWORD"

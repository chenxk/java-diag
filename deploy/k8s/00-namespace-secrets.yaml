# 草稿：命名空间 + Secret（按环境改值后 apply）
apiVersion: v1
kind: Namespace
metadata:
  name: java-diag
---
apiVersion: v1
kind: Secret
metadata:
  name: java-diag-tokens
  namespace: java-diag
type: Opaque
stringData:
  # Agent → Gateway
  agent-token: "agent-secret"
  # Gateway / Agent → Probe（探针 auth.token）
  probe-token: "probe-secret"
  # 可选：Registry /registry/* ；空则信任内网
  register-token: ""
  admin-user: "admin"
  admin-password: "java-diag"

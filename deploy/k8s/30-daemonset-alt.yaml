# 草稿备选：节点级 DaemonSet（非 sidecar）
#
# 适用：不想改每个业务 Deployment，统一在节点上挂探针。
# 代价：权限更大（hostPID），且容器 PID ↔ 宿主 PID 映射更绕；
#       日志要靠 hostPath / 约定目录，不如 sidecar 干净。
#
# 多数场景仍推荐 20-app-with-sidecar.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: java-diag-node-probe
  namespace: java-diag
  labels:
    app: java-diag-node-probe
spec:
  selector:
    matchLabels:
      app: java-diag-node-probe
  template:
    metadata:
      labels:
        app: java-diag-node-probe
    spec:
      hostPID: true
      containers:
        - name: java-diag
          image: your-registry/java-diag-probe:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            # 视环境收紧；hostPID 诊断常需要较高权限
            privileged: false
          ports:
            - name: mcp
              containerPort: 8765
              hostPort: 8765
          env:
            - name: JAVA_DIAG_HTTP_HOST
              value: "0.0.0.0"
            - name: JAVA_DIAG_HTTP_PORT
              value: "8765"
            - name: JAVA_DIAG_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: java-diag-tokens
                  key: probe-token
            - name: JAVA_DIAG_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JAVA_DIAG_ALLOWED_LOG_DIRS
              value: "/var/log,/var/log/pods,/tmp"
            - name: JAVA_DIAG_REGISTER_URL
              value: "http://java-diag-gateway.java-diag.svc.cluster.local:8787"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: JAVA_DIAG_ADVERTISE_URL
              value: "http://$(NODE_IP):8765"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JAVA_DIAG_TAGS
              value: "mode=daemonset,node=$(NODE_NAME)"
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

# =============================================================================
# java-diag Gateway — local deploy template
# Copy jars from target/ after `mvn package` (jars are not committed).
# REPLACE every CHANGE_ME before any shared / production use.
# =============================================================================

http.host=0.0.0.0
http.port=8787

# Agent / MCP Bearer — required in any non-local shared environment
auth.token=CHANGE_ME_AGENT_TOKEN
# /registry/* ; empty = trust private network only
register.token=

heartbeat.ttl.seconds=90
instance.id=

audit.path=./logs/java-diag-gateway-audit.log
dump.cooldown.ms=10000

admin.user=admin
admin.password=CHANGE_ME_ADMIN_PASSWORD

# =============================================================================
# Java Diag Gateway — 本地部署配置模板（模块名 java-diag-gateway）
#
# 用法：
#   1) mvn package 后拷贝 jar 到本目录（jar 不入库）
#      cp ../../java-diag-gateway/target/java-diag-gateway.jar ./
#   2) 把下方所有 CHANGE_ME_* 改成实际密钥（含 admin.password）
#   3) ./start.sh start   或 start.cmd / start.ps1
#
# 加载优先级：内置默认 → 本文件 → 环境变量 JAVA_DIAG_* → CLI（最高；覆盖鉴权用 --auth-token，无 --token 别名）
# 完整说明：docs/CONFIGURATION.md
# Gateway 仅 HTTP，无 transport 配置项
# =============================================================================

# --- HTTP ---
# 监听地址：0.0.0.0 表示本机所有网卡；仅本机访问可改为 127.0.0.1
http.host=0.0.0.0
# Agent / Admin / Registry 共用的 Gateway 端口（默认 8787）
# MCP：http://<host>:8787/mcp（仍兼容 /sse）    Admin：http://<host>:8787/admin/
http.port=8787

# --- 鉴权 Auth ---
# Agent → Gateway 的 MCP Bearer（Authorization: Bearer <token>；必填，不可为空）
auth.token=CHANGE_ME_AGENT_TOKEN
# 探针调用 /registry/register|heartbeat|deregister 时的 Bearer（必填）；须与探针对齐
register.token=CHANGE_ME_REGISTER_TOKEN

# --- 注册表 / 心跳 ---
# 探针心跳 TTL（秒）：超过该时间未 heartbeat 则标记不健康/不再路由；有效值 ≥5
heartbeat.ttl.seconds=90
# Gateway 自身 MCP 响应信封里的 instanceId；空=运行时自动 gateway-{pid}
instance.id=

# --- 审计 ---
# 代理侧审计日志（JSON Lines）：每次转发探针工具调用记一条
audit.path=./logs/java-diag-gateway-audit.log

# --- 限流 ---
# 昂贵工具（如 heap_dump / thread_dump）在网关侧的冷却时间（毫秒）
# 冷却期内同一探针同一工具返回 RATE_LIMITED；探针侧另有独立冷却
dump.cooldown.ms=10000

# --- Admin 控制台（/admin/）---
# 浏览器登录用户名（与 Agent Bearer 无关）
admin.user=admin
# 浏览器登录密码；部署到共享环境前务必改成强密码
admin.password=CHANGE_ME_ADMIN_PASSWORD

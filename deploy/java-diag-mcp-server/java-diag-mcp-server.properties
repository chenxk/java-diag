# =============================================================================
# java-diag 探针（Probe）— 本地部署配置模板
#
# 用法：
#   1) mvn package 后拷贝 jar 到本目录（jar 不入库）
#      cp ../../java-diag-mcp-server/target/java-diag-mcp-server.jar ./
#   2) 把下方所有 CHANGE_ME_* 改成实际密钥
#   3) 若挂 Gateway：填 register.url / advertise.url，并与网关 register.token 对齐
#   4) ./start.sh start   或 start.cmd / start.ps1
#
# 加载优先级：内置默认 → 本文件 → 环境变量 JAVA_DIAG_* → CLI（最高）
# 完整说明：docs/CONFIGURATION.md
# =============================================================================

# --- 传输 / HTTP ---
# 传输模式：http（远程 Agent/Gateway）| stdio（本地 IDE 拉起）
transport=http
# HTTP 监听地址
http.host=0.0.0.0
# 探针 MCP 端口（默认 8765）；Agent 直连示例：http://<host>:8765/sse
http.port=8765

# --- 鉴权 Auth ---
# Agent / Gateway 调用本探针 MCP 时的 Bearer
# 共享/生产必须设置；空=不鉴权（仅适合本机临时调试）
auth.token=CHANGE_ME_PROBE_TOKEN

# --- 日志白名单 / 诊断范围 ---
# 允许读取的日志目录，逗号分隔；空=平台默认（cwd、$HOME、临时目录等）
# 例：/var/log/app,/home/app/logs
allowed.log.dirs=
# 可诊断 JVM 的 mainClass 正则；空=不过滤（所有本机 Java 进程）
allowed.main.class.regex=
# 进程名映射，便于 resolve_service / Admin 按业务名查找
# 格式：pattern=业务名,pattern2=业务名2（pattern 可匹配 jar 或 mainClass 子串）
# 例：MeorientB2bRpcServer=meorientb2b-rpc,order-service=order-service
app.name.map=

# --- 工具超时与输出限制 ---
# 普通诊断子进程超时（毫秒），如 jstat、grep_log
tool.timeout.ms=15000
# heap/thread dump 等昂贵操作子进程超时（毫秒）
dump.timeout.ms=30000
# 工具 stdout/stderr 捕获上限（字节）；超出则截断，信封 truncated=true
max.output.bytes=262144
# 是否启用危险工具（heap_dump、live GC 等）；生产默认保持 false
dangerous.tools.enabled=false
# 探针本地审计日志（JSON Lines）
audit.path=./logs/java-diag-audit.log

# --- 限流 ---
# 同一探针上昂贵工具的冷却时间（毫秒）；冷却期内返回 RATE_LIMITED
dump.cooldown.ms=10000

# --- 集群注册（可选；register.url 非空时启用心跳）---
# 逻辑服务名，出现在 Gateway list_instances / Admin；空=本机主网卡 IP
service.name=
# Gateway 根 URL（不要带 /sse）；例：http://127.0.0.1:8787 或 http://gateway-host:8787
register.url=http://127.0.0.1:8787
# 调用 Gateway /registry/* 的 Bearer；须与网关 register.token 一致；双方皆空=信任内网
register.token=
# 对外公布的 MCP 基址，Gateway 用它回连本探针；也决定 instanceId=host:port
# 例：http://10.0.1.11:8765 ；空则尽量自动推断（容器/K8s 建议显式填写）
advertise.url=
# 向 Gateway 发送心跳的间隔（秒，有效值 ≥5）；应小于网关 heartbeat.ttl.seconds
heartbeat.interval.seconds=20
# 实例标签，逗号分隔 key=value，用于按环境/集群过滤
# 例：env=test,app=order-service,zone=bj
tags=

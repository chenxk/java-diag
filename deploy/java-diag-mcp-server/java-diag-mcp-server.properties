# =============================================================================
# java-diag Probe — local deploy template
# Copy jars from target/ after `mvn package` (jars are not committed).
# REPLACE every CHANGE_ME before any shared / production use.
# =============================================================================

transport=http
http.host=0.0.0.0
http.port=8765

auth.token=CHANGE_ME_PROBE_TOKEN

allowed.log.dirs=
allowed.main.class.regex=
app.name.map=

tool.timeout.ms=15000
dump.timeout.ms=30000
max.output.bytes=262144
dangerous.tools.enabled=false
audit.path=./logs/java-diag-audit.log
dump.cooldown.ms=10000

service.name=
register.url=http://127.0.0.1:8787
register.token=
advertise.url=
heartbeat.interval.seconds=20
tags=
